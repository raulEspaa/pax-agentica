<style>

  .banner .btn { height: 26px; margin-left: 6px; }

  .moods .bar b { position: absolute; top: -3px; width: 3px; height: 10px; margin-left: -1px; background: var(--brass-hi); box-shadow: 0 0 0 1px #000; }

  .throne .stat { display: grid; grid-template-columns: 98px auto 1fr; gap: 6px; align-items: center; font-size: 13.5px; margin-top: 3px; }
  .throne .stat small { color: var(--ink-3); }
  .statpips { display: inline-flex; gap: 2px; }
  .statpips i { width: 9px; height: 9px; border: 1px solid var(--brass-lo); background: var(--walnut-lo); }
  .statpips i.on { background: var(--brass-face); border-color: #4a3312; }
  .council { display: grid; gap: 8px; }
  .seat { border: 1px solid rgba(196, 154, 82, .35); background: var(--walnut-lo); padding: 7px 9px; }
  .seat h5 { margin: 0 0 5px; font: 700 13.5px var(--display); color: var(--brass-hi); }
  .seat-who { display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: center; }
  .seat-who .btn { margin-top: 4px; height: 24px; font-size: 12.5px; }
  .vacant { width: 48px; height: 48px; border: 2px dashed var(--brass-lo); display: grid; place-items: center; font: 700 22px var(--display); color: var(--brass-lo); }
  .offer { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 3px 0; border-top: 1px dotted rgba(196, 154, 82, .25); font-size: 13.5px; }
  .offer .btn { height: 24px; font-size: 12.5px; }
  .enjoys { margin: 4px 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }
  .discovery, .work { margin: 6px 0; padding: 7px 10px; border: 1px solid #8a6a3a; background: rgba(230, 194, 126, .35); font-size: 15px; }
  .work { background: rgba(255, 250, 235, .5); }
  .threat { margin: 6px 0; padding: 7px 10px; border: 1px solid #8f2f22; background: rgba(208, 87, 76, .12); color: #6e1f16; font-size: 15px; }
  .ending { margin: 4px 0 10px; padding: 10px 12px; border: 2px solid #8a6a3a; background: rgba(230, 194, 126, .3); }
  .ending.won { border-color: #b58a3e; box-shadow: 0 0 0 1px #ecd08c, 0 0 18px rgba(236, 208, 140, .6); }
  .ending h3 { margin: 0 0 4px; font: 700 19px var(--display); }
  .ending table { width: 100%; margin: 6px 0; }
  .ending tr.me td { font-weight: 700; background: rgba(196, 154, 82, .3); }
</style>
</head>
<body>
<div class="app v2">
  <header class="topbar">
    <button class="realmbtn" id="realmbtn" data-tip="Your realm: open the Crown" type="button"><span class="shield" id="myshield"></span><b id="myname"></b></button>
    <div class="treasury num" id="treasury"></div>
    <div class="spacer"></div>
    <div class="tablewrap" id="tablestatus" hidden></div>
    <div class="date" aria-live="polite"><b id="year" class="num"></b><small id="turnlabel"></small></div>
    <div class="orderswrap"><button class="iconbtn" id="ordersbtn" type="button" data-tip="This year's orders"></button>
      <section class="ordersbox" id="orders"></section></div>
    <button class="btn primary" id="endturn" title="Send your orders and let the year pass">End the year</button>
    <button class="iconbtn" id="guide" type="button" data-tip="How to play"></button>
    <button class="iconbtn" id="feedback" type="button" data-tip="Send feedback to the makers"></button>
  </header>
  <div class="stage">
    <div class="mapwrap" id="mapwrap">
      <svg id="map" role="img" aria-label="Map of Europe"></svg>
      <div class="hintbar" id="hintbar" role="status"></div>
      <div class="mapdock">
        <div class="legend" id="legend"></div>
        <div class="dockrow"><div class="group modes" role="group" aria-label="Map mode"></div>
          <div class="zoom"><button class="iconbtn" id="zin" aria-label="Zoom in" data-tip="Zoom in"></button>
            <button class="iconbtn" id="zout" aria-label="Zoom out" data-tip="Zoom out"></button>
            <button class="iconbtn" id="zhome" aria-label="Show my realm" data-tip="Show my realm"></button></div></div>
      </div>
      <div class="deed" id="deed" role="dialog" aria-labelledby="deedname"></div>
      <div class="tip" id="tip"></div>
    </div>
    <nav class="offices rail" id="rail" role="tablist" aria-label="Offices of the realm"></nav>
    <section class="panel" id="panel" aria-labelledby="paneltitle">
      <header class="panelhead"><span class="ic" id="panelicon"></span><h3 id="paneltitle"></h3>
        <button class="iconbtn" id="panelpin" type="button" data-tip="Keep this window open"></button>
        <button class="iconbtn" id="panelclose" type="button" data-tip="Close (Esc)"></button></header>
      <div class="office" id="office" role="tabpanel"></div>
    </section>
    <div id="banner" class="toasts"></div>
    <div id="notices" class="notices" aria-live="polite"></div>
  </div>
</div>
<div class="richtip" id="richtip" role="tooltip"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><div class="sheet" id="sheet"></div></div>
<div class="error" id="error" role="alert"></div>
<script src="/static/icons.js"></script>
<script src="/static/map.js"></script>
<script src="/static/play.js"></script>
