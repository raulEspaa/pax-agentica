<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pax Agentica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/map.css">
<style>
  .realm { display: flex; align-items: center; gap: 9px; }
  .realm .shield { width: 26px; height: 30px; box-shadow: 0 0 0 1px var(--brass); }
  .realm b { font: 700 20px var(--display); color: var(--brass-hi); display: block; line-height: 1.05; text-shadow: 0 2px 2px #000; }
  .realm span { font-size: 12.5px; color: var(--ink-3); font-style: italic; }
  .treasury { display: flex; gap: 4px; }
  .treasury > div { min-width: 66px; padding: 2px 7px; text-align: center; line-height: 1.15; background: var(--walnut-lo);
                    border: 1px solid var(--brass-lo); box-shadow: inset 0 1px 4px rgba(0, 0, 0, .8); }
  .treasury b { display: block; font-size: 15.5px; }
  .treasury i { font-style: normal; font-size: 12px; color: #9dc79e; }
  .treasury i.neg { color: #f1a69d; }
  .treasury small { color: var(--ink-3); font-size: 11.5px; display: block; }
  .treasury .btn { height: 18px; min-width: 0; padding: 0 6px; font-size: 11.5px; margin-top: 1px; }

  /* the court's offices: a row of brass medallions */
  .offices { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 10px 12px 0 6px; }
  .offices button { position: relative; height: 54px; padding: 2px 0 0; cursor: pointer; color: var(--engraved);
                    background: var(--brass-face); border: 1px solid #4a3312; border-radius: 3px 3px 0 0;
                    box-shadow: inset 0 1px 0 rgba(255, 246, 214, .7), 0 2px 3px rgba(0, 0, 0, .5); font: 600 11.5px var(--body); }
  .offices button .ic { display: block; font-size: 19px; line-height: 1.25; }
  .offices button[aria-selected="true"] { background: var(--brass-press); color: #1b0f02; box-shadow: inset 0 2px 5px rgba(40, 20, 0, .6); }
  .offices .count { position: absolute; top: 3px; right: 4px; min-width: 17px; padding: 0 4px; border-radius: 9px;
                    background: #8f2f22; color: #fff; font-size: 11.5px; line-height: 17px; text-shadow: none; }
  .office { margin: 0 12px 10px 6px; border: 2px solid transparent; border-image: var(--brass-face) 1; background: var(--leather);
            box-shadow: 0 3px 8px rgba(0, 0, 0, .6), inset 0 0 14px rgba(0, 0, 0, .55); }
  .office h4, .ordersbox h4 { margin: 10px 0 5px; font: 700 14px var(--display); color: var(--brass-hi); }
  .pad { padding: 8px 11px 11px; }
  .nrow { display: grid; grid-template-columns: 20px 1fr auto; gap: 7px; align-items: center; padding: 6px 11px;
          border-top: 1px solid rgba(196, 154, 82, .14); cursor: pointer; }
  .nrow:first-child { border-top: none; }
  .nrow:hover, .nrow.sel { background: var(--leather-hi); }
  .nrow .chips { margin: 2px 0 0; }
  .nrow small, .sub { color: var(--ink-3); font-size: 13px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 5px 0; }
  .bundle { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin: 3px 0; }
  .bundle label { font-size: 11.5px; color: var(--ink-3); text-align: center; }
  input[type=number], select.field, textarea { background: var(--walnut-lo); border: 1px solid var(--brass-lo); color: var(--ink); }
  .bundle input { width: 100%; padding: 2px; text-align: center; }
  select.field { height: 28px; padding: 0 4px; }
  textarea { width: 100%; min-height: 58px; padding: 5px; resize: vertical; }
  .warn { color: #f1a69d; font-size: 13.5px; }
  .ok { color: #a6dbb4; }
  .item { padding: 7px 11px; border-top: 1px solid rgba(196, 154, 82, .14); font-size: 14px; }
  .item:first-child { border-top: none; }
  .letter { font-style: italic; color: var(--sepia); background: var(--vellum-tex), linear-gradient(#f4e8cb, var(--vellum-2));
            padding: 6px 10px; margin-top: 5px; white-space: pre-wrap; border-left: 3px solid var(--brass); }
  table.grid { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .grid th { font-weight: 600; color: var(--ink-3); text-align: right; padding: 3px 4px; font-size: 12.5px; }
  .grid td { text-align: right; padding: 3px 4px; border-top: 1px solid rgba(196, 154, 82, .14); }
  .grid th:first-child, .grid td:first-child { text-align: left; }
  .grid tr.click { cursor: pointer; } .grid tr.click:hover td { background: var(--leather-hi); }
  .grid tr.sum td { border-top: 1px solid var(--brass-lo); font-weight: 600; }
  .grid td.neg { color: #f1a69d; } .grid td.pos { color: #a6dbb4; }
  .tech { border: 1px solid rgba(196, 154, 82, .3); background: var(--walnut-lo); padding: 8px 10px; margin: 8px 0; }
  .tech b { font: 700 16px var(--display); color: var(--brass-hi); }
  .pips { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: middle; }
  .pips i { width: 12px; height: 12px; border: 1px solid var(--brass); transform: rotate(45deg); }
  .pips i.on { background: var(--brass-face); }
  .general-card { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 7px 0; border-top: 1px solid rgba(196, 154, 82, .14); }
  .general-card:first-of-type { border-top: none; }
  .ordersbox { margin: 0 12px 10px 6px; border: 2px solid transparent; border-image: var(--brass-face) 1; background: var(--leather); }
  .ordersbox h4 { margin: 0; padding: 5px 24px 4px; color: var(--engraved); text-shadow: 0 1px 0 rgba(255, 240, 200, .6);
                  background-image: var(--rivet), var(--rivet), var(--brass-face); background-position: 6px 50%, calc(100% - 6px) 50%, 0 0;
                  background-size: 9px 9px, 9px 9px, 100% 100%; background-repeat: no-repeat; display: flex; justify-content: space-between; }
  .ordersbox h4 small { font: italic 500 13px var(--body); color: #4a3010; text-shadow: none; }
  .order { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 4px 11px; border-top: 1px solid rgba(196, 154, 82, .14); font-size: 14px; }
  .order:first-of-type { border-top: none; }
  .order button { width: 24px; height: 22px; background: none; border: 1px solid var(--brass-lo); color: var(--ink-3); cursor: pointer; }
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, .6); z-index: 20; }
  .modal.open { display: flex; }
  .sheet { width: min(580px, 94vw); max-height: 82vh; overflow: auto; color: var(--sepia); padding: 18px 22px;
           background: var(--vellum-tex), radial-gradient(ellipse at 30% 20%, #f7ecd1, var(--vellum) 55%, var(--vellum-2));
           border: 8px solid #3a2414; outline: 1px solid var(--brass); outline-offset: -11px; box-shadow: 0 16px 40px rgba(0, 0, 0, .75); }
  .sheet h2 { margin: 0 0 8px; font: 700 23px var(--display); }
  .sheet ul { margin: 6px 0 12px; padding-left: 20px; }
  .sheet li { margin: 3px 0; }
  .sheet li.bad { color: #8f2f22; }
  .banner { margin: 10px 12px 0 6px; padding: 9px 12px; color: var(--sepia); background: var(--vellum-tex), linear-gradient(#f4e8cb, var(--vellum-2)); border: 1px solid #7a5c2c; }
  .error { position: fixed; left: 50%; top: 76px; transform: translateX(-50%); z-index: 30; color: var(--sepia); padding: 8px 16px; display: none;
           background: var(--vellum-tex), linear-gradient(#f4e8cb, var(--vellum-2)); border: 2px solid #8f2f22; box-shadow: 0 6px 18px rgba(0, 0, 0, .6); }
  .office .btn, .ordersbox .btn { height: 28px; }
  /* the tree of learning */
  .tree { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .branch h5 { margin: 0 0 6px; font: 700 13px var(--display); color: var(--brass-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .branch h5 small { display: block; font: italic 400 12px var(--body); color: var(--ink-3); }
  .node { position: relative; padding: 6px 6px 7px 26px; font-size: 12.5px; line-height: 1.25; border: 1px solid rgba(196, 154, 82, .3); background: var(--walnut-lo); }
  .node b { display: block; font-size: 13.5px; }
  .node .lvl { position: absolute; left: 4px; top: 6px; width: 17px; height: 17px; border-radius: 50%; text-align: center; font: 700 11px/17px var(--body);
               border: 1px solid var(--brass-lo); color: var(--ink-3); }
  .node .unl { margin: 3px 0 2px; color: var(--ink-2); }
  .node .chipb { display: inline-block; padding: 0 5px; margin: 1px 2px 1px 0; border: 1px solid var(--brass-lo); border-radius: 8px; font-size: 12px; }
  .node.done { background: linear-gradient(#3a2c18, #2a1f12); border-color: var(--brass); }
  .node.done .lvl { background: var(--brass-face); color: var(--engraved); border-color: #4a3312; }
  .node.next, .node.doing { border-color: var(--brass-hi); box-shadow: 0 0 0 1px var(--brass-hi), 0 0 12px rgba(236, 208, 140, .35); }
  .node.doing { animation: glow 1.8s ease-in-out infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 0 1px var(--brass-hi), 0 0 4px rgba(236, 208, 140, .2); } to { box-shadow: 0 0 0 1px var(--brass-hi), 0 0 16px rgba(236, 208, 140, .55); } }
  @media (prefers-reduced-motion: reduce) { .node.doing { animation: none; } }
  .node.locked { opacity: .55; }
  .node .btn { margin-top: 4px; height: 24px; padding: 0 8px; font-size: 12.5px; }
  .link { width: 2px; height: 10px; margin: 0 auto; background: var(--brass-lo); }
  /* the crown and its council */
  .throne { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
  .throne b { font: 700 17px var(--display); color: var(--brass-hi); }
  .portrait { display: block; border: 2px solid var(--brass); box-shadow: 0 0 0 1px #000, 0 3px 6px rgba(0, 0, 0, .6); }
  .stat { display: grid; grid-template-columns: 98px auto 1fr; gap: 6px; align-items: center; font-size: 13.5px; margin-top: 3px; }
  .stat small { color: var(--ink-3); }
  .statpips { display: inline-flex; gap: 2px; }
  .statpips i { width: 9px; height: 9px; border: 1px solid var(--brass-lo); background: var(--walnut-lo); }
  .statpips i.on { background: var(--brass-face); border-color: #4a3312; }
  .council { display: grid; gap: 8px; }
  .seat { border: 1px solid rgba(196, 154, 82, .35); background: var(--walnut-lo); padding: 7px 9px; }
  .seat h5 { margin: 0 0 5px; font: 700 13.5px var(--display); color: var(--brass-hi); }
  .seat-who { display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: center; }
  .seat-who .btn { margin-top: 4px; height: 24px; font-size: 12.5px; }
  .vacant { width: 48px; height: 48px; border: 2px dashed var(--brass-lo); display: grid; place-items: center; font: 700 22px var(--display); color: var(--brass-lo); }
  .offer { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 3px 0; border-top: 1px dotted rgba(196, 154, 82, .25); font-size: 13.5px; }
  .offer .btn { height: 24px; font-size: 12.5px; }
  .enjoys { margin: 4px 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }
  .discovery, .work { margin: 6px 0; padding: 7px 10px; border: 1px solid #8a6a3a; background: rgba(230, 194, 126, .35); font-size: 15px; }
  .work { background: rgba(255, 250, 235, .5); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="realm"><span class="shield" id="myshield"></span><div><b id="myname"></b><span>your realm</span></div></div>
    <div class="treasury num" id="treasury"></div>
    <div class="group modes" role="group" aria-label="Map mode"></div>
    <div class="plaque" aria-live="polite"><b id="year" class="num"></b><span id="turnlabel"></span></div>
    <button class="btn primary" id="endturn" title="Send your orders and let the year pass">End the year</button>
  </header>
  <div class="main">
    <div class="mapwrap" id="mapwrap">
      <svg id="map" role="img" aria-label="Map of Europe"></svg>
      <div class="neatline" aria-hidden="true"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="in"></i></div>
      <div class="hintbar" id="hintbar" role="status"></div>
      <div class="zoom">
        <button class="btn" id="zin" aria-label="Zoom in" title="Zoom in">+</button>
        <button class="btn" id="zout" aria-label="Zoom out" title="Zoom out">−</button>
        <button class="btn" id="zhome" aria-label="Show my realm" title="Show my realm">⌂</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="deed" id="deed" role="dialog" aria-labelledby="deedname"></div>
      <div class="tip" id="tip"></div>
    </div>
    <aside>
      <div id="banner"></div>
      <nav class="offices" role="tablist" aria-label="Offices of the realm">
        <button role="tab" data-tab="realm"><span class="ic">💰</span>Realm</button>
        <button role="tab" data-tab="crown"><span class="ic">👑</span>Crown</button>
        <button role="tab" data-tab="army"><span class="ic">⚔</span>Army</button>
        <button role="tab" data-tab="tech"><span class="ic">⚙</span>Learning</button>
        <button role="tab" data-tab="diplomacy"><span class="ic">🤝</span>Envoys</button>
        <button role="tab" data-tab="letters"><span class="ic">✉</span>Letters</button>
        <button role="tab" data-tab="chronicle"><span class="ic">📖</span>Chronicle</button>
      </nav>
      <section class="office" id="office" role="tabpanel"></section>
      <section class="ordersbox" id="orders"></section>
      <p class="help">Left-click your province to select its regiments; right-click a green province to march, a red one to attack.
        <kbd>1</kbd>–<kbd>4</kbd> map modes, <kbd>Esc</kbd> deselects.</p>
    </aside>
  </div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><div class="sheet" id="sheet"></div></div>
<div class="error" id="error" role="alert"></div>
<script src="/static/map.js"></script>
<script src="/static/play.js"></script>
</body>
</html>
