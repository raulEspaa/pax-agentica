[project]
name = "pax-agentica"
version = "0.1.0"
description = "A strategy game where every nation is ruled by an AI agent: they trade, negotiate, betray each other and go to war."
readme = "README.md"
authors = [{ name = "Raúl Fernández España" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.30",
]

[project.scripts]
pax = "pax_agentica.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".claude/skills"]  # vendored third-party skills: not ours to reformat

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes   I: import sorting      B: bugbear (likely bugs)
# UP: modern syntax             S: bandit (security)   PT: pytest style
# SIM: simplifications          RUF: ruff-specific
select = ["E", "F", "I", "B", "UP", "S", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"] # pytest asserts; seeded random numbers are intended in tests
# SQL built from our own constants only; every value is a query parameter
"src/pax_agentica/agents/archive.py" = ["S608"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib -n auto"  # xdist: about 2 min, not 6

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]
mapgen = [
    "shapely>=2.2.0",
]
# The AI rulers. A group of its own, so that the image of the multiplayer tables goes without.
ai = [
    "google-adk>=2.13",
    "google-genai>=2.34.0",
    "langfuse>=5.0.1",
    "langgraph>=1.2.0",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
]

[tool.uv]
default-groups = ["dev", "ai"]
# google-adk caps OpenTelemetry at 1.44 while langfuse 5 needs 1.45: a cautious cap, not a known
# break (ADK only uses the stable tracing API). Lifting it keeps both on the same OTel, so one
# trace can hold the council and the Archivist. Drop this when ADK raises its cap.
override-dependencies = ["opentelemetry-api>=1.45,<2", "opentelemetry-sdk>=1.45,<2"]
