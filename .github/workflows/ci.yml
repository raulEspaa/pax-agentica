# Continuous integration: every pull request and every push to main must pass this.
# No API keys live here on purpose: tests that call a real LLM never run in CI.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the GITHUB_TOKEN: read the code, nothing else.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a commit SHA, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not just the last one
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # no license needed for personal accounts

  # Every push to main that passes the checks above goes live: the image is built here,
  # pushed to Artifact Registry and rolled out to Cloud Run. No key is stored anywhere:
  # GitHub's OIDC token is exchanged for a short-lived Google credential (Workload Identity
  # Federation), and only main of this repository may do it (see docs/deploy.md).
  deploy:
    name: deploy to Cloud Run
    needs: [python, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # to ask GitHub for the OIDC token Google trusts
    concurrency:
      group: deploy
      cancel-in-progress: false # never stop a roll-out halfway
    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: pax-tables
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/pax/pax-tables:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Roll out to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
            --service-account "pax-runtime@$PROJECT.iam.gserviceaccount.com" \
            --execution-environment gen2 \
            --add-volume "name=tables,type=cloud-storage,bucket=$PROJECT-tables" \
            --add-volume-mount "volume=tables,mount-path=/data" \
            --set-secrets "PAX_INVITE_CODE=pax-invite-code:latest" \
            --max-instances 1 --min-instances 0 --concurrency 80 --cpu 1 --memory 512Mi \
            --allow-unauthenticated \
            --labels "app=pax-agentica,commit=${GITHUB_SHA::7}" \
            --quiet

      - name: Smoke test
        run: |
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')"
          ok=""
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url/api/health"; then ok=1; break; fi
            sleep 5
          done
          test -n "$ok"
          curl -fsS "$url/api/lobby" > /dev/null
          echo "Live at $url" >> "$GITHUB_STEP_SUMMARY"
